user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent [$connection_requests] "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  30;
    keepalive_requests 2;

    ###### 压缩相关配置

    # 启用 Gzip 压缩
    gzip on;

    # 压缩级别 (1-9)
    # 5 是大小和 CPU 使用率之间的最佳折衷，对大多数 ASCII 文件可实现约 75% 的压缩率
    # (几乎与级别 9 相同)
    gzip_comp_level    5;

    # 不压缩那些已经很小且不太可能显著缩小的文件
    # (默认值是 20 字节，这不太好，因为通常会导致压缩后文件反而更大)
    gzip_min_length    256;

    # 即使对于通过代理连接的客户端也进行压缩
    # 可通过"Via"头识别（CloudFront 需要）
    gzip_proxied       any;

    # 当客户端的 Accept-Encoding 能力头不同时，告诉代理同时缓存压缩和未压缩版本的资源
    # 避免极少数不支持 gzip 的客户端在其代理提供压缩版本时显示乱码的问题
    gzip_vary          on;

    # 压缩具有以下 MIME 类型的所有输出
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
    # text/html 总是被 HttpGzipModule 自动压缩

    output_buffers 20 10m;

    client_max_body_size 10m;

    include /etc/nginx/conf.d/superset.conf;
}